<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Open Access Vibrant Accent -->
    <linearGradient id="oaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Download Arrow Cyan Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="lockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Background Subtle Grid / Dots -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1.5">
    <line x1="70" y1="120" x2="442" y2="120" />
    <line x1="70" y1="200" x2="442" y2="200" />
    <line x1="70" y1="280" x2="442" y2="280" />
    <line x1="70" y1="360" x2="442" y2="360" />
    <line x1="120" y1="70" x2="120" y2="442" />
    <line x1="256" y1="70" x2="256" y2="442" />
    <line x1="392" y1="70" x2="392" y2="442" />
  </g>

  <!-- 2. Academic Document Sheet (Angled slightly or Center) -->
  <g filter="url(#shadowFilter)">
    <!-- Base Paper Page -->
    <path d="M 144 116 
             L 300 116 
             L 368 184 
             L 368 396 
             C 368 408, 358 418, 346 418 
             L 144 418 
             C 132 418, 122 408, 122 396 
             L 122 138 
             C 122 126, 132 116, 144 116 Z" 
          fill="url(#docGrad)" />

    <!-- Paper Fold Corner -->
    <path d="M 300 116 
             L 300 174 
             C 300 180, 304 184, 310 184 
             L 368 184 Z" 
          fill="url(#foldGrad)" />

    <!-- Minimal Academic Text Lines on Paper -->
    <rect x="156" y="180" width="110" height="12" rx="6" fill="#94A3B8" opacity="0.6" />
    <rect x="156" y="210" width="180" height="10" rx="5" fill="#CBD5E1" />
    <rect x="156" y="234" width="160" height="10" rx="5" fill="#CBD5E1" />
    <rect x="156" y="258" width="140" height="10" rx="5" fill="#CBD5E1" />
  </g>

  <!-- 3. Open Access Unlock Icon Emblem (Vibrant Orange/Gold at top-right / overlap) -->
  <g filter="url(#lockGlow)" transform="translate(4,-6)">
    <!-- Lock Shackle (Opened) -->
    <path d="M 326 126 
             A 32 32 0 0 1 390 126 
             L 390 102 
             A 32 32 0 0 0 326 102" 
          fill="none" 
          stroke="url(#oaGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />
    
    <!-- Lock Body Circle (Open Access classic logo ring) -->
    <circle cx="358" cy="146" r="28" fill="url(#oaGrad)" />
    <!-- Keyhole / Center Void -->
    <circle cx="358" cy="146" r="11" fill="#0F172A" />
  </g>

  <!-- 4. Fast Harvester Download Dynamic Badge (Bottom Center / Floating) -->
  <g filter="url(#shadowFilter)">
    <!-- Circular Shield / Download Base -->
    <circle cx="256" cy="354" r="58" fill="#0F172A" stroke="url(#arrowGrad)" stroke-width="6" />

    <!-- High-Tech Download Arrow -->
    <path d="M 256 324 L 256 372" stroke="url(#arrowGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 234 354 L 256 376 L 278 354" fill="none" stroke="url(#arrowGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Tray Bracket -->
    <path d="M 226 384 L 226 392 C 226 395, 229 398, 232 398 L 280 398 C 283 398, 286 395, 286 392 L 286 384" 
          fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 5. Modern Corner Tech Tag "PDF" -->
  <g transform="translate(146, 360)">
    <rect x="0" y="0" width="56" height="24" rx="6" fill="#EF4444" />
    <text x="28" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">PDF</text>
  </g>
</svg>
